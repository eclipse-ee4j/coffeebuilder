# .github/workflows/maven-ci-cd.yml
name: Coffee Builder Maven Plugin CI/CD

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  MAVEN_ARGS: --batch-mode --no-transfer-progress --file pom.xml

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn $MAVEN_ARGS verify

  deploy-snapshot:
    name: Deploy SNAPSHOT to Sonatype
    needs: build

    # Solo publica snapshots cuando hay un push real a develop.
    # Un pull request hacia develop ejecutará únicamente el job build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN

      - name: Validate SNAPSHOT version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          echo "Current version: $CURRENT_VERSION"

          if [[ "$CURRENT_VERSION" != *-SNAPSHOT ]]; then
            echo "::error::develop must use a -SNAPSHOT version before deploying snapshots."
            exit 1
          fi

      - name: Deploy SNAPSHOT to Sonatype Central
        run: mvn $MAVEN_ARGS deploy
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}

  release:
    name: Release to Sonatype Central
    needs: build

    # Solo crea releases cuando hay un push real a main.
    # Un pull request hacia main ejecutará únicamente el job build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN

      - name: Set release version
        id: set_version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          echo "Current version: $CURRENT_VERSION"

          if [[ "$CURRENT_VERSION" != *-SNAPSHOT ]]; then
            echo "::error::main must receive a -SNAPSHOT version before creating a release."
            exit 1
          fi

          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}

          echo "Release version: $RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

          mvn $MAVEN_ARGS versions:set \
            -DnewVersion="$RELEASE_VERSION" \
            -DgenerateBackupPoms=false

      - name: Deploy Release to Maven Central
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}

          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY || secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE || secrets.GPG_PASSPHRASE || secrets.GPG_PASSPHARSE }}

        run: |
          if [ -z "$MAVEN_GPG_KEY" ]; then
            echo "::error::Missing GitHub secret: MAVEN_GPG_KEY or GPG_PRIVATE_KEY"
            exit 1
          fi

          if [ -z "$MAVEN_GPG_PASSPHRASE" ]; then
            echo "::error::Missing GitHub secret: MAVEN_GPG_PASSPHRASE, GPG_PASSPHRASE, or GPG_PASSPHARSE"
            exit 1
          fi

          mvn $MAVEN_ARGS clean deploy -P release

      - name: Create GitHub Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}